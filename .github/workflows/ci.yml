name: CI

on:
  push:
    branches: ["feature/**", "test/**", 2.3.x]
  pull_request:
    branches: ["test/**", 2.3.x]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Verify tests and coverage
        run: mvn -B --no-transfer-progress clean verify
